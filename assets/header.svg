<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Mahdi's Lab — Data Engineer header animation</title>
  <desc>Animated pipeline flow: raw data to pipeline to insight, with floating nodes and pulsing arrows</desc>

  <defs>
    <style>
      .bg { fill: #0B1020; }
      .grid-line { stroke: #111827; stroke-width: 0.5; }
      .node-box { fill: #111827; stroke: #1D4ED8; stroke-width: 1; rx: 8; }
      .node-label { font-family: 'Courier New', Courier, monospace; font-size: 13px; font-weight: 700; fill: #00F7FF; text-anchor: middle; }
      .node-sub { font-family: 'Courier New', Courier, monospace; font-size: 10px; fill: #7C3AED; text-anchor: middle; }
      .title-text { font-family: 'Courier New', Courier, monospace; font-size: 28px; font-weight: 900; fill: #00F7FF; text-anchor: middle; letter-spacing: 6px; }
      .sub-text { font-family: 'Courier New', Courier, monospace; font-size: 12px; fill: #7C3AED; text-anchor: middle; letter-spacing: 4px; }
      .arrow-line { stroke: #1D4ED8; stroke-width: 1.5; fill: none; stroke-dasharray: 6 3; }
      .dot { fill: #00F7FF; }
      .bracket { font-family: 'Courier New', Courier, monospace; font-size: 22px; fill: #1D4ED8; text-anchor: middle; }

      .node-a { animation: floatA 3.2s ease-in-out infinite; }
      .node-b { animation: floatB 3.8s ease-in-out infinite; }
      .node-c { animation: floatC 3s ease-in-out infinite; }
      .node-d { animation: floatD 4.2s ease-in-out infinite; }
      .node-e { animation: floatE 2.9s ease-in-out infinite; }

      .arrow-1 { animation: arrowPulse 2s ease-in-out infinite; }
      .arrow-2 { animation: arrowPulse 2s 0.5s ease-in-out infinite; }
      .arrow-3 { animation: arrowPulse 2s 1s ease-in-out infinite; }
      .arrow-4 { animation: arrowPulse 2s 1.5s ease-in-out infinite; }

      .dot-travel-1 { animation: travelDot 2s linear infinite; }
      .dot-travel-2 { animation: travelDot 2s 0.5s linear infinite; }
      .dot-travel-3 { animation: travelDot 2s 1s linear infinite; }
      .dot-travel-4 { animation: travelDot 2s 1.5s linear infinite; }

      .title-glow { animation: titlePulse 4s ease-in-out infinite; }

      @keyframes floatA { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-6px)} }
      @keyframes floatB { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-5px)} }
      @keyframes floatC { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-7px)} }
      @keyframes floatD { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-4px)} }
      @keyframes floatE { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-6px)} }
      @keyframes arrowPulse { 0%,100%{opacity:0.25} 50%{opacity:1} }
      @keyframes travelDot { 0%{opacity:0;offset-distance:0%} 10%{opacity:1} 90%{opacity:1} 100%{opacity:0;offset-distance:100%} }
      @keyframes titlePulse { 0%,100%{opacity:1} 50%{opacity:0.8} }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="200" class="bg"/>

  <!-- subtle grid -->
  <line x1="0" y1="40" x2="900" y2="40" class="grid-line"/>
  <line x1="0" y1="80" x2="900" y2="80" class="grid-line"/>
  <line x1="0" y1="120" x2="900" y2="120" class="grid-line"/>
  <line x1="0" y1="160" x2="900" y2="160" class="grid-line"/>
  <line x1="180" y1="0" x2="180" y2="200" class="grid-line"/>
  <line x1="360" y1="0" x2="360" y2="200" class="grid-line"/>
  <line x1="540" y1="0" x2="540" y2="200" class="grid-line"/>
  <line x1="720" y1="0" x2="720" y2="200" class="grid-line"/>

  <!-- title top center -->
  <text x="450" y="38" class="title-text title-glow">MAHDI'S LAB</text>
  <text x="450" y="56" class="sub-text">DATA ENGINEER · PIPELINE ARCHITECT</text>

  <!-- dashed arrow lines (behind nodes) -->
  <!-- raw_data -> ingest -->
  <line x1="118" y1="128" x2="162" y2="128" class="arrow-line arrow-1"/>
  <!-- ingest -> transform -->
  <line x1="258" y1="128" x2="302" y2="128" class="arrow-line arrow-2"/>
  <!-- transform -> stream -->
  <line x1="398" y1="128" x2="442" y2="128" class="arrow-line arrow-3"/>
  <!-- stream -> insight -->
  <line x1="538" y1="128" x2="582" y2="128" class="arrow-line arrow-4"/>

  <!-- arrowheads -->
  <polygon points="162,123 172,128 162,133" fill="#1D4ED8" class="arrow-1"/>
  <polygon points="302,123 312,128 302,133" fill="#1D4ED8" class="arrow-2"/>
  <polygon points="442,123 452,128 442,133" fill="#1D4ED8" class="arrow-3"/>
  <polygon points="582,123 592,128 582,133" fill="#1D4ED8" class="arrow-4"/>

  <!-- traveling dots -->
  <circle r="3" fill="#00F7FF" class="arrow-1">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0s">
      <mpath href="#path1"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#00F7FF" class="arrow-2">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.5s">
      <mpath href="#path2"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#00F7FF" class="arrow-3">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1s">
      <mpath href="#path3"/>
    </animateMotion>
  </circle>
  <circle r="3" fill="#00F7FF" class="arrow-4">
    <animateMotion dur="2s" repeatCount="indefinite" begin="1.5s">
      <mpath href="#path4"/>
    </animateMotion>
  </circle>

  <defs>
    <path id="path1" d="M118,128 L172,128"/>
    <path id="path2" d="M258,128 L312,128"/>
    <path id="path3" d="M398,128 L452,128"/>
    <path id="path4" d="M538,128 L592,128"/>
  </defs>

  <!-- NODE A: raw data (x=30, center=75) -->
  <g class="node-a" style="transform-origin:75px 128px">
    <rect x="20" y="108" width="110" height="40" rx="8" fill="#0F172A" stroke="#1D4ED8" stroke-width="1.2"/>
    <text x="75" y="124" class="node-label">{ raw }</text>
    <text x="75" y="138" class="node-sub">data source</text>
  </g>

  <!-- NODE B: ingest (center=210) -->
  <g class="node-b" style="transform-origin:210px 128px">
    <rect x="162" y="108" width="106" height="40" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="215" y="124" class="node-label">ingest</text>
    <text x="215" y="138" class="node-sub">kafka · scraper</text>
  </g>

  <!-- NODE C: transform (center=350) -->
  <g class="node-c" style="transform-origin:350px 128px">
    <rect x="302" y="108" width="106" height="40" rx="8" fill="#0F172A" stroke="#00F7FF" stroke-width="1.5"/>
    <text x="355" y="124" class="node-label">transform</text>
    <text x="355" y="138" class="node-sub">spark · pandas</text>
  </g>

  <!-- NODE D: stream (center=490) -->
  <g class="node-d" style="transform-origin:490px 128px">
    <rect x="442" y="108" width="106" height="40" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="495" y="124" class="node-label">stream</text>
    <text x="495" y="138" class="node-sub">pipeline · etl</text>
  </g>

  <!-- NODE E: insight (center=635) -->
  <g class="node-e" style="transform-origin:635px 128px">
    <rect x="582" y="108" width="106" height="40" rx="8" fill="#0F172A" stroke="#1D4ED8" stroke-width="1.2"/>
    <text x="635" y="124" class="node-label">insight</text>
    <text x="635" y="138" class="node-sub">decisions</text>
  </g>

  <!-- right side: bracket + tagline -->
  <text x="760" y="118" class="bracket">[</text>
  <text x="800" y="112" class="node-label" style="font-size:11px; text-anchor:start;">building</text>
  <text x="800" y="126" class="node-label" style="font-size:11px; text-anchor:start;">learning</text>
  <text x="800" y="140" class="node-label" style="font-size:11px; text-anchor:start;">shipping</text>
  <text x="880" y="118" class="bracket">]</text>

  <!-- bottom status bar -->
  <rect x="0" y="185" width="900" height="15" fill="#060C18"/>
  <text x="20" y="196" font-family="'Courier New', monospace" font-size="9" fill="#1D4ED8">● PIPELINE ONLINE</text>
  <text x="180" y="196" font-family="'Courier New', monospace" font-size="9" fill="#7C3AED">◈ KAFKA CONNECTED</text>
  <text x="360" y="196" font-family="'Courier New', monospace" font-size="9" fill="#00F7FF">▶ SPARK RUNNING</text>
  <text x="520" y="196" font-family="'Courier New', monospace" font-size="9" fill="#1D4ED8">◉ DATA FLOWING</text>
  <text x="680" y="196" font-family="'Courier New', monospace" font-size="9" fill="#7C3AED">✦ AUTOMATION ACTIVE</text>

</svg>
